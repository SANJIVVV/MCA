<!DOCTYPE html>
<html>
<head>
    <title>forEach Example</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin: 40px;
        }

        input, textarea {
            padding: 10px;
            margin: 10px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            border-top: 1px solid gray;
        }
    </style>
</head>

<body>

<h2>Display Each Element Using forEach()</h2>

<input type="text" id="input" placeholder="Arun,Bala,Charan,Divya">
<br>

<button onclick="execute()">Execute</button>
<br>

<textarea id="output" readonly></textarea>

<script>
function execute() {

    let arr = document.getElementById("input").value.split(",");

    let result = "";

    arr.forEach(function(name) {
        result += name + "\n";
    });

    document.getElementById("output").value = result;
}
</script>

<footer>
    © 26MX217 | Sanjivkumar
</footer>

</body>
</html>
